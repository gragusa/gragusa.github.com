project:
  type: website
  pre-render: bibliography/makebib.py
  preview:
    port: 7875
    browser: true
    watch-inputs: true
    navigate: true

  resources:
    - "data/**"

  render:
    - "*.qmd"

execute:
  freeze: auto

website:
  title: "Giuseppe Ragusa"
  site-url: https://gragusa.org
  repo-url: "https://github.com/gragusa/gragusa.github.com"
  description: "gragusa's website"
  favicon: favicon.png
  # Posts marked `draft: true` are not rendered or listed.
  draft-mode: gone
  open-graph:
    locale: en_US
  twitter-card:
    creator: "@gragusa"
  navbar:
    title: "Giuseppe Ragusa"
    right:
      - text: "CV"
        href: gragusa_cv.pdf
      - text: "Papers"
        href: papers
      - text: "Code"
        href: code
      - text: "Data"
        href: factors
      - text: "Teaching"
        href: teaching
      - text: "Blog"
        href: blog.html
      - icon: rss
        href: blog.xml
        aria-label: "Blog RSS feed"

  page-footer:
    left: "Giuseppe Ragusa · ORCID [{{< var orcid >}}](https://orcid.org/{{< var orcid >}})"

format:
  academic-html: default
